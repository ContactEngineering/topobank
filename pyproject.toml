[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = 'topobank'
description = 'A surface metrology cloud database'
requires-python = ">=3.10.0"
readme = 'README.rst'
license = { file = 'LICENSE' }
authors = [
    { name = "Gunner Clary", email = "gunner.clary@surface.design" },
    { name = "Ioannis Nezis", email = "ioannis@nezis.de" },
    { name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de" },
    { name = "Michael Röttger", email = "info@michael-roettger.de" },
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Framework :: Django',
    'Framework :: Celery',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content',
]
dependencies = [
    # Django
    'django==5.2.17',       # https://www.djangoproject.com/
    'django-allauth>=65.0', # https://github.com/pennersr/django-allauth
    'fido2',                # required by django-allauth

    # tagging support
    # Pinned to a fork: the released django-tagulous (2.1.1) monkeypatches
    # `serializer._get_model`, which Django 5.2 removed, so it raises an
    # AttributeError on import. See radiac/django-tagulous#187. Upstream has
    # fixed this on `main` but has not released it yet, and has meanwhile
    # renamed the import path `tagulous` -> `django_tagulous`. When the next
    # upstream release lands, move back to PyPI and update the `tagulous.*`
    # imports in manager migrations 0011, 0049 and 0064 in the same change.
    'django-tagulous @ git+https://github.com/stephendwolff/django-tagulous.git@d80ef84',

    #
    # Storage
    #
    'boto3',           # S3
    'django-storages',

    # Celery
    # django-kombu # is this still needed? See https://pypi.org/project/django-kombu/
    'celery[redis]>=5.2.3',
    # with memcached we've had several problems within a Docker swarm stack
    # pylibmc seems to cause memcache problems: see GH 737
    # librabbitmq>=2.0
    # problems while compiling librabbitmq

    # Flower (monitoring for celery) is currently not used because of dependency and security problems
    # flower==1.0.0

    # tornado>=4.2.0, <6.0.0

    # Surface topography I/O and analysis
    'SurfaceTopography>=1.20.0',

    # Validation
    'pydantic',

    # pandas is currently needed for downloading xlsx files from analyses
    'pandas',

    # xarray is used to write analysis data to netcdf files
    'xarray',

    # notifications
    # Pinned to a commit rather than a branch so that builds are reproducible.
    # The last PyPI release (1.8.3) predates Django 4.2 support, so we cannot
    # use it; upstream master does support Django 5.2 but 1.9.0 was tagged
    # without ever being published. Upstream has been quiet since, so this is
    # a candidate for replacement -- we only use the `notify` signal and the
    # `Notification` model.
    'django-notifications-hq @ git+https://github.com/django-notifications/django-notifications.git@4c44bcea2504d9a3fcd26366b232a13732a08f2a',

    # openpyxl
    'openpyxl',

    # requests from server
    'requests',

    # Unit conversion
    'pint>=0.24.4',  # https://github.com/hgrecco/pint/issues/2074

    # markdown conversion for terms & conditions and for docstrings in readers
    'markdown2',

    # for syntax highlighting of fenced code blocks in the above
    'pygments',

    # reading metadata from surface containers
    'PyYAML',

    # because of problem with AttributeError for 'X509_V_FLAG_CB_ISSUER_CHECK'
    'pyopenssl>=23.0.0',

    # Note on security pins: `urllib3`, `lxml`, `jinja2`, `cryptography`,
    # `Pillow`, `sqlparse` and `pyjwt` used to be listed here with lower
    # bounds carrying 2020-2023 CVE mitigations. Every one of those floors is
    # several major versions behind what actually resolves today, and none of
    # them are imported directly -- they arrive via Django, requests, boto3,
    # django-allauth and SurfaceTopography. Renovate and Dependabot alerts
    # cover them now; re-adding a floor here only hides that.

    # Environment variables
    'django-environ',

    # Timer
    'muGrid>=0.105.1',

    # Database
    'psycopg[binary]',

    # Timer
    'muTimer',

    # API Documentation
]

[project.optional-dependencies]
dev = [
    'Werkzeug',
    # https://github.com/pallets/werkzeug
    'ipdb',
    # https://github.com/gotcha/ipdb
    # Not version 2.9 because of this
    # https://stackoverflow.com/questions/68024060/assertionerror-database-connection-isnt-set-to-utc

    # Documentation
    # ------------------------------------------------------------------------------
    'Sphinx',
    # https://github.com/sphinx-doc/sphinx
    'sphinx_rtd_theme',

    # Testing
    # ------------------------------------------------------------------------------
    'pytest',
    'pytest-sugar',
    'pytest-env',

    # Code quality
    # ------------------------------------------------------------------------------
    'flake8',
    'coverage',

    # Django
    # ------------------------------------------------------------------------------
    'factory-boy',
    # https://github.com/FactoryBoy/factory_boy
    'django-test-plus',
    # https://github.com/revsys/django-test-plus

    'django-celery-results',
    # https://django-celery-results.readthedocs.io/en/latest/

    'django-debug-toolbar',
    # https://github.com/jazzband/django-debug-toolbar
    # Debug toolbar must be compatible with Django 3.2
    'django-extensions>=3.2.0',
    # https://github.com/django-extensions/django-extensions
    'django-coverage-plugin',
    # https://github.com/nedbat/django_coverage_plugin
    'pytest-django>=4.4.0',
    # https://github.com/pytest-dev/pytest-django
    'pytest-mock',
    'pytest-cov',

    # Dependency Handling
    # ------------------------------------------------------------------------------
    'pip-tools>=6.8.0',

    # Docker
    # ------------------------------------------------------------------------------
    # docker-compose
    # introduces dependency on a too old pyyaml version

    # Debugging
    # ------------------------------------------------------------------------------

    # for testing functions depending on date functions
    'freezegun',

    # JAX
    'jax',
]

[project.urls]
homepage = 'https://contact.engineering'
repository = 'https://github.com/ContactEngineering/topobank'

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
env = ["DJANGO_SETTINGS_MODULE=test_settings"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["topobank"]
# No `force-include` for `topobank/testing/data` is needed: hatchling honours VCS
# ignore files, and the `data/` pattern in `.gitignore` used to match this
# directory and drop it from the wheel. That pattern is anchored to the repository
# root now, so the directory is picked up as part of the package — force-including
# it as well makes hatchling add every file twice and fail the build.

[tool.hatch.build.targets.sdist]
include = ["topobank"]
